name: "Admission Newswire & AI Intelligence"

on:
  schedule:
    # Twice-hourly pins; GitHub may still delay, but this beats a single 2h hole.
    - cron: "12 * * * *"
    - cron: "42 * * * *"
  workflow_dispatch:

concurrency:
  group: "crawl-newswire"
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  newswire:
    name: "Monitor Education Desks & Ingest Admission News"
    runs-on: ubuntu-latest
    timeout-minutes: 8

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}
          fetch-depth: 40

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci || npm install --no-audit

      - name: Run Admission Newswire Engine
        env:
          GITHUB_ACTIONS: "true"
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          node --experimental-strip-types scripts/crawl-newswire.ts --force

      - name: Commit and push newswire updates
        run: |
          chmod +x scripts/git-publish.sh
          scripts/git-publish.sh "chore(wire): admission newswire & intelligence update" data/wire/ public/wire/
