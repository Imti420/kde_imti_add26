name: "Admission Newswire & AI Intelligence"

on:
  schedule:
    # Runs every 2 hours automatically
    - cron: "0 */2 * * *"
  workflow_dispatch:
    # Allows manual execution on demand from the Actions tab

concurrency:
  group: "crawl-newswire"
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  newswire:
    name: "Monitor Education Desks & Ingest Admission News"
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci || npm install --no-audit

      - name: Run Admission Newswire Engine
        env:
          GITHUB_ACTIONS: "true"
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          node --experimental-strip-types scripts/crawl-newswire.ts --force

      - name: Commit and push newswire updates
        run: |
          git config --global user.name "Imti420"
          git config --global user.email "imtihanislam57@gmail.com"
          git add data/wire/ public/wire/
          if git diff --staged --quiet; then
            echo "No new admission headlines or newswire updates found."
          else
            git commit -m "chore(wire): admission newswire & intelligence update"
            git push origin HEAD:main
          fi
