name: "University Discovery Crawler"

on:
  schedule:
    # Runs every 3 hours automatically
    - cron: "0 */3 * * *"
  workflow_dispatch:
    # Allows manual execution on demand from the Actions tab

concurrency:
  group: "discover-admissions"
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  discover:
    name: "Scan Official University Portals & Notice Boards"
    runs-on: ubuntu-latest
    timeout-minutes: 8

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci || npm install --no-audit

      - name: Crawl regression checks
        run: node --experimental-strip-types scripts/bench-bugs.ts

      - name: Run University Discovery Engine
        env:
          GITHUB_ACTIONS: "true"
        run: |
          node --experimental-strip-types scripts/crawl-admissions.ts --force

      - name: Commit and push official discoveries
        run: |
          git config --global user.name "Imti420"
          git config --global user.email "imtihanislam57@gmail.com"
          git add data/ops/ public/ops/
          if git diff --staged --quiet; then
            echo "No new university documents or reachability changes discovered."
          else
            git commit -m "chore(ops): official university admission discovery update"
            git push origin HEAD:main
          fi
