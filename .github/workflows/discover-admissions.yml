name: "University Discovery Crawler"

on:
  schedule:
    # GitHub schedule is best-effort and often drifts. Multiple pins raise the
    # chance of a run inside each hour instead of a single missed */45 slot.
    - cron: "7 * * * *"
    - cron: "27 * * * *"
    - cron: "47 * * * *"
  workflow_dispatch:

concurrency:
  group: "discover-admissions"
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  discover:
    name: "Scan Official University Portals & Notice Boards"
    runs-on: ubuntu-latest
    timeout-minutes: 12

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}
          fetch-depth: 40

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci || npm install --no-audit

      - name: Crawl regression checks
        run: node --experimental-strip-types scripts/bench-bugs.ts

      - name: Run University Discovery Engine
        env:
          GITHUB_ACTIONS: "true"
        run: |
          node --experimental-strip-types scripts/crawl-admissions.ts --force

      - name: Commit and push official discoveries
        run: |
          chmod +x scripts/git-publish.sh
          scripts/git-publish.sh "chore(ops): official university admission discovery update" data/ops/ public/ops/
