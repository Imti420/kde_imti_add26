<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <style>
      @font-face {
        font-family: "Barlow Condensed";
        font-weight: 800;
        src: url("./fonts/BarlowCondensed-800.ttf") format("truetype");
      }
      @font-face {
        font-family: "Barlow Condensed";
        font-weight: 700;
        src: url("./fonts/BarlowCondensed-700.ttf") format("truetype");
      }
      @font-face {
        font-family: "IBM Plex Mono";
        font-weight: 600;
        src: url("./fonts/IBMPlexMono-600.ttf") format("truetype");
      }
      @font-face {
        font-family: "IBM Plex Mono";
        font-weight: 500;
        src: url("./fonts/IBMPlexMono-500.ttf") format("truetype");
      }
      * { box-sizing: border-box; margin: 0; padding: 0; }
      html, body {
        width: 1200px;
        height: 630px;
        overflow: hidden;
        background: #f3efe6;
      }
      body {
        color: #141414;
        font-family: "IBM Plex Mono", ui-monospace, monospace;
      }
      .page {
        width: 1200px;
        height: 630px;
        padding: 28px;
        background: #f3efe6;
      }
      .frame {
        width: 100%;
        height: 100%;
        border: 10px solid #141414;
        border-radius: 28px;
        background: #f3efe6;
        padding: 22px 28px 24px;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
      }
      .mast {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        font-weight: 600;
        font-size: 18px;
        letter-spacing: 0.18em;
        text-transform: uppercase;
      }
      .mast-mark {
        display: flex;
        align-items: center;
        gap: 10px;
      }
      .dots {
        display: flex;
        gap: 7px;
      }
      .dots i {
        width: 14px;
        height: 14px;
        border: 2px solid #141414;
        border-radius: 99px;
        display: block;
      }
      .dots i:nth-child(1) { background: #e10600; }
      .dots i:nth-child(2) { background: #ffe14a; }
      .dots i:nth-child(3) { background: #141414; }
      .rule {
        height: 4px;
        background: #141414;
        margin-top: 14px;
      }
      .stage {
        position: relative;
        flex: 1;
        display: flex;
        align-items: center;
        justify-content: center;
        margin: 18px 8px 16px;
      }
      .slab {
        position: relative;
        width: 860px;
        background: #ffe14a;
        border: 8px solid #141414;
        border-radius: 32px;
        box-shadow: 16px 16px 0 0 #e10600;
        padding: 28px 40px 30px;
        text-align: center;
      }
      .kicker {
        font-weight: 600;
        font-size: 16px;
        letter-spacing: 0.22em;
        text-transform: uppercase;
      }
      h1 {
        margin-top: 6px;
        font-family: "Barlow Condensed", "Arial Narrow", Impact, sans-serif;
        font-weight: 800;
        font-size: 132px;
        line-height: 0.82;
        letter-spacing: -0.02em;
        text-transform: uppercase;
        color: #141414;
      }
      h1 span { color: #e10600; }
      .sub {
        margin-top: 14px;
        font-family: "Barlow Condensed", "Arial Narrow", sans-serif;
        font-weight: 700;
        font-size: 28px;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        line-height: 1;
      }
      .chips {
        display: flex;
        justify-content: space-between;
        gap: 16px;
      }
      .chip {
        flex: 1;
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 52px;
        border: 4px solid #141414;
        border-radius: 16px;
        background: #fffdf8;
        box-shadow: 5px 5px 0 0 #141414;
        font-weight: 600;
        font-size: 16px;
        letter-spacing: 0.16em;
        text-transform: uppercase;
      }
    </style>
  </head>
  <body>
    <div class="page">
      <div class="frame">
        <header>
          <div class="mast">
            <span class="mast-mark"><span class="dots"><i></i><i></i><i></i></span> Dhaka</span>
            <span>Session 2026–27</span>
          </div>
          <div class="rule"></div>
        </header>
        <div class="stage">
          <div class="slab">
            <p class="kicker">Issue //26</p>
            <h1>ADMISSION<span>//</span>26</h1>
            <p class="sub">The Bangladesh university admission archive</p>
          </div>
        </div>
        <div class="chips">
          <span class="chip">Circular archive</span>
          <span class="chip">Deadline radar</span>
          <span class="chip">Local desk</span>
        </div>
      </div>
    </div>
  </body>
</html>
